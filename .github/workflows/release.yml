name: Release CastnCasa Home Assistant 1.0.15

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CastnCasa 1.0.15 release state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/castncasa/manifest.json").read_text())
          if manifest.get("version") != "1.0.15":
              raise SystemExit(f"Unexpected manifest version: {manifest.get('version')}")
          if "lovelace" not in manifest.get("dependencies", []):
              raise SystemExit("manifest is missing the Lovelace dependency")

          const = Path("custom_components/castncasa/const.py").read_text()
          if 'INTEGRATION_VERSION = "1.0.15"' not in const:
              raise SystemExit("const.py is not at 1.0.15")

          for path in (
              "custom_components/castncasa/frontend/castncasa-time-calendar.js",
              "custom_components/castncasa/frontend/castncasa-calendar-patch.js",
              "custom_components/castncasa/frontend/castncasa-desktop-text.js",
          ):
              if not Path(path).is_file():
                  raise SystemExit(f"Missing frontend release file: {path}")
          PY
          git diff --check

      - name: Create GitHub release v1.0.15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.15 already exists."
            exit 0
          fi
          TARGET="$(git rev-parse HEAD)"
          gh release create v1.0.15 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "CastnCasa Home Assistant 1.0.15" \
            --notes "Fixes CastnCasa calendar loading after HACS updates by persistently registering the bundled calendar modules as Lovelace resources while retaining the frontend fallback. Also ships the production-tested desktop readability improvement: short time bars such as N1 use larger, bolder text without the previous heavy horizontal compression. Mobile and tablet calendar presentation are unchanged from 1.0.14."
