name: Release CastnCasa Home Assistant 1.0.8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.8 already exists."
            exit 0
          fi
          gh release create v1.0.8 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.8" \
            --notes "Improves resident lifecycle handling and color synchronization. Removed residents can be paired again cleanly and their entities are recreated across sensor, binary-sensor and calendar platforms. Resident calendar colors continue to follow the current CastnCasa resident color, including persisted Home Assistant calendar colors. The complete resident entity contract remains unchanged."
