name: Release CastnCasa Home Assistant 1.0.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.2 already exists."
            exit 0
          fi
          gh release create v1.0.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.2" \
            --notes "Adds resident presence independent from calendar synchronization, encrypted app heartbeats, Home Assistant person/device-tracker presence, last-seen and plan-deviation sensors, and actual-presence priority for CastnCasa Heat. Validated with Hassfest and the HACS Action."
