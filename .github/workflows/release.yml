name: Release CastnCasa Home Assistant 1.0.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.4 already exists."
            exit 0
          fi
          gh release create v1.0.4 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.4" \
            --notes "Branding fix: replaces the Home Assistant integration logo with the official CastnCasa wordmark and updates repository branding. No entity, pairing, synchronization, presence or API behavior changes."
