name: Release CastnCasa Home Assistant 1.0.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.3 already exists."
            exit 0
          fi
          gh release create v1.0.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.3" \
            --notes "Aligns release metadata and customer documentation with the shipped dual-sync and independent-presence contract. Documents eleven resident-specific entities, automatic remote/local Home Assistant synchronization, and actual-presence priority for CastnCasa Heat. No breaking entity-ID changes."
