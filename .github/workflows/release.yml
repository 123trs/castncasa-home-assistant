name: Release CastnCasa Home Assistant 1.0.11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.11 already exists."
            exit 0
          fi
          gh release create v1.0.11 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.11" \
            --notes "Fixes resident removal from Home Assistant. Deleting a CastnCasa resident device now removes the resident schedule, revokes the app pairing and clears the resident entities, while household and Heat aggregate devices remain protected."
