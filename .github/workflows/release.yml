name: Release CastnCasa Home Assistant 1.0.9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.9 already exists."
            exit 0
          fi
          gh release create v1.0.9 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.9" \
            --notes "Hotfix for CastnCasa Home Assistant 1.0.8: restores the missing DATA_PRESENCE constant so the integration loads correctly after restart. Resident lifecycle handling and calendar-color synchronization from 1.0.8 remain included."
