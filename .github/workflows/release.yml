name: Release CastnCasa Home Assistant 1.0.7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.7 already exists."
            exit 0
          fi
          gh release create v1.0.7 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.7" \
            --notes "Fixes resident calendar colors in Home Assistant. CastnCasa now keeps the persisted Home Assistant calendar color synchronized with each resident color from the app, including existing calendar entities and later color changes. No entity-ID or pairing changes."
