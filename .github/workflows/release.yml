name: Release CastnCasa Home Assistant 1.0.26

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply target-specific learning
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Marker missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "custom_components/castncasa/const.py",
              'INTEGRATION_VERSION = "1.0.25"',
              'INTEGRATION_VERSION = "1.0.26"',
          )

          replace(
              "custom_components/castncasa/learning.py",
              '''    def _valid_cycles(self) -> list[dict[str, Any]]:\n        return [\n            cycle\n            for cycle in self._cycles\n            if isinstance(cycle.get("required_minutes"), (int, float))\n            and cycle.get("valid", True)\n        ]\n''',
              '''    def _valid_cycles(self) -> list[dict[str, Any]]:\n        current_target = self.target_temp\n        return [\n            cycle\n            for cycle in self._cycles\n            if isinstance(cycle.get("required_minutes"), (int, float))\n            and cycle.get("valid", True)\n            and isinstance(cycle.get("target_temp"), (int, float))\n            and abs(float(cycle["target_temp"]) - current_target)\n            <= LEARNING_TARGET_TOLERANCE\n        ]\n''',
          )

          replace(
              "custom_components/castncasa/learning.py",
              '''        if self._refresh_heating_targets():\n            self.hass.async_create_task(self._async_save())\n        household = self.coordinator.data.get("household", {})\n''',
              '''        if self._refresh_heating_targets():\n            self.hass.async_create_task(self._async_save())\n        if self._active is not None:\n            active_target = self._active.get("target_temp")\n            if (\n                isinstance(active_target, (int, float))\n                and abs(float(active_target) - self.target_temp)\n                > LEARNING_TARGET_TOLERANCE\n            ):\n                self._discard_active("target_temperature_changed", now)\n        household = self.coordinator.data.get("household", {})\n''',
          )

          manifest_path = Path("custom_components/castncasa/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("version") != "1.0.25":
              raise SystemExit(f"Unexpected starting version: {manifest.get('version')}")
          manifest["version"] = "1.0.26"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          PY

          python3 -m compileall -q custom_components/castncasa
          git diff --check

      - name: Verify release state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/castncasa/manifest.json").read_text())
          assert manifest["version"] == "1.0.26"
          const = Path("custom_components/castncasa/const.py").read_text()
          assert 'INTEGRATION_VERSION = "1.0.26"' in const
          learning = Path("custom_components/castncasa/learning.py").read_text()
          assert 'abs(float(cycle["target_temp"]) - current_target)' in learning
          assert 'target_temperature_changed' in learning
          PY

      - name: Commit CastnCasa 1.0.26 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/castncasa
          git commit -m "CastnCasa 1.0.26: separate learning by comfort target"
          git push origin HEAD:main

      - name: Create GitHub release v1.0.26
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="$(git rev-parse HEAD)"
          gh release create v1.0.26 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "CastnCasa Home Assistant 1.0.26" \
            --notes "Adaptive reheating learning is now separated by the live comfort target temperature. Cycles learned at 22 °C no longer influence predictions at 23 °C, but remain stored and become usable again if the same target is selected later. An active learning cycle is discarded and safely restarted when the comfort target changes during that cycle."
