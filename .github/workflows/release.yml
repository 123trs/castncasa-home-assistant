name: Release CastnCasa Home Assistant 1.0.12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.12 already exists."
            exit 0
          fi
          gh release create v1.0.12 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.12" \
            --notes "Improves resident color handling. Automatically assigned colors are kept distinct between active residents, manually chosen duplicate colors remain allowed, and a resident color can be updated persistently in Home Assistant. Includes the resident-removal fix from 1.0.11."
