name: Release CastnCasa Home Assistant 1.0.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release v1.0.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.10 already exists."
            exit 0
          fi
          gh release create v1.0.10 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CastnCasa Home Assistant 1.0.10" \
            --notes "Full synchronization of the tested CastnCasa Home Assistant integration. Fixes the Heat sensor presence fields including actual_home_now and effective_presence_source, while preserving resident lifecycle cleanup, calendar-color synchronization, pairing, dual remote/local sync and updated translations."
