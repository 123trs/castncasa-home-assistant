name: Release CastnCasa Home Assistant 1.0.24

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CastnCasa 1.0.24 release state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/castncasa/manifest.json").read_text())
          if manifest.get("version") != "1.0.24":
              raise SystemExit(f"Unexpected manifest version: {manifest.get('version')}")

          const = Path("custom_components/castncasa/const.py").read_text()
          if 'INTEGRATION_VERSION = "1.0.24"' not in const:
              raise SystemExit("const.py is not at 1.0.24")

          schedule = Path("custom_components/castncasa/schedule.py").read_text()
          for marker in (
              "PROFILE_HISTORY_BASELINE",
              "_merge_profile_history",
              "_profile_for_day",
              '"profile_history": profile_history',
          ):
              if marker not in schedule:
                  raise SystemExit(f"Profile history marker is missing: {marker}")

          heat = Path("custom_components/castncasa/heat.py").read_text()
          if "effective_reheat_lead_minutes" not in heat:
              raise SystemExit("Adaptive reheating lead support is missing")

          learning = Path("custom_components/castncasa/learning.py").read_text()
          for marker in (
              "LEARNING_MIN_CYCLES = 3",
              "LEARNING_AUTO_APPLY_CYCLES = 5",
              "HeatLearningManager",
              "required_minutes",
          ):
              if marker not in learning:
                  raise SystemExit(f"Heat learning marker is missing: {marker}")

          coordinator = Path("custom_components/castncasa/coordinator.py").read_text()
          if '"heat_learning" in current_data' not in coordinator:
              raise SystemExit("Coordinator does not preserve Heat learning state")
          PY
          python3 -m compileall -q custom_components/castncasa
          git diff --check

      - name: Create GitHub release v1.0.24
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.24 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.24 already exists."
            exit 0
          fi
          TARGET="$(git rev-parse HEAD)"
          gh release create v1.0.24 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "CastnCasa Home Assistant 1.0.24" \
            --notes "Preserves historical shift profile values when travel times, shift start/end times, or other profile settings are changed later. Existing calendar days keep the profile definition that applied before the change, while the new definition applies from the change date onward. Existing installations migrate automatically on the next schedule sync; the mobile API remains backward-compatible and does not expose internal profile history."
