name: Release CastnCasa Home Assistant 1.0.14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CastnCasa 1.0.14 release state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/castncasa/manifest.json").read_text())
          if manifest.get("version") != "1.0.14":
              raise SystemExit(f"Unexpected manifest version: {manifest.get('version')}")

          const = Path("custom_components/castncasa/const.py").read_text()
          if 'INTEGRATION_VERSION = "1.0.14"' not in const:
              raise SystemExit("const.py is not at 1.0.14")

          for path in (
              "custom_components/castncasa/frontend/castncasa-time-calendar.js",
              "custom_components/castncasa/frontend/castncasa-calendar-patch.js",
          ):
              if not Path(path).is_file():
                  raise SystemExit(f"Missing frontend release file: {path}")
          PY
          git diff --check

      - name: Create GitHub release v1.0.14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.14 already exists."
            exit 0
          fi
          TARGET="$(git rev-parse HEAD)"
          gh release create v1.0.14 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "CastnCasa Home Assistant 1.0.14" \
            --notes "Adds the production-tested CastnCasa calendar card to the HACS integration. Desktop and tablet month views position and size resident shift bars from the actual shift start and end times, with rounded bars and short labels. The legend lists only shifts present in the selected month. Mobile uses compact resident-colored shift chips stacked vertically and an FT holiday chip. Calendar data is checked every 60 seconds and the view refreshes only when CastnCasa data changed, while preserving the selected month."
